workflows:
  ios-workflow:
    name: Z.iA iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - ./node_modules
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Node
        script: |
          npm install
      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios
          cd ios/App && pod install && cd ../..
      - name: Build IPA without signing (test)
        script: |
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release CODE_SIGNING_ALLOWED=NO -sdk iphoneos -archivePath $HOME/App.xcarchive archive || true
          mkdir -p build/ios/ipa
          cd $HOME && zip -r App.ipa App.xcarchive || true
          cp -r $HOME/App.xcarchive $PWD/build/ios/ipa/ || true
    artifacts:
      - build/ios/ipa/*
      - /tmp/xcodebuild_logs/*.log
